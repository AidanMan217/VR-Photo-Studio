# Continuous integration: lint, unit tests on Linux + Windows, WebXR viewer browser tests.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  RUFF_VERSION: "0.16.8"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUTF8: "1"

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false
      - name: ruff check
        run: uvx "ruff@${RUFF_VERSION}" check --output-format=github .

  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      QT_QPA_PLATFORM: offscreen
    defaults:
      run:
        shell: bash # also on Windows (Git Bash): fails the step on the first error
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: Install VR Photo Studio (editable, with dev tools)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest -m "not models" -q --durations=15 tests packaging/tests

  bundle:
    # Quick check that packaging/vrphoto.spec still produces a working app on every branch
    # (the full Windows build + installer runs in build.yml).
    name: PyInstaller bundle smoke test (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
      VRPHOTO_TEST_PYINSTALLER: "1"
      VRPHOTO_TEST_FROZEN_SELFTEST: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: Install VR Photo Studio (with build tools)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Build the bundle and run the frozen self-test
        run: python -m pytest -q -rs packaging/tests/test_frozen_build.py

  viewer:
    name: WebXR viewer (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: tests/viewer
    steps:
      - uses: actions/checkout@v7

      - name: Detect viewer tests
        id: detect
        working-directory: .
        run: |
          if [ -f tests/viewer/package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::tests/viewer/package.json not found - viewer tests skipped."
          fi

      # Playwright's webServer runs tests/viewer/serve_fixtures.py, which builds the fixture
      # scene library with vrphoto (numpy, Pillow, imageio-ffmpeg) - so Python is needed too.
      - uses: actions/setup-python@v7
        if: steps.detect.outputs.present == 'true'
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install VR Photo Studio (for the fixture server)
        if: steps.detect.outputs.present == 'true'
        working-directory: .
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          echo "PYTHON=$(command -v python)" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v7
        if: steps.detect.outputs.present == 'true'
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Install test dependencies
        if: steps.detect.outputs.present == 'true'
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Install Chromium for Playwright
        if: steps.detect.outputs.present == 'true'
        run: npx playwright install --with-deps chromium

      - name: Run viewer tests
        if: steps.detect.outputs.present == 'true'
        run: npm test

      - name: Upload Playwright report
        if: failure() && steps.detect.outputs.present == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            tests/viewer/playwright-report/
            tests/viewer/test-results/
          if-no-files-found: ignore
          retention-days: 14
