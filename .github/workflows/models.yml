# Real-model checks: verify the pinned model registry against Hugging Face / GitHub and run
# the tests that need the real ONNX models (downloaded here, where huggingface.co is reachable).
name: Models

on:
  workflow_dispatch:
    inputs:
      refresh_lock:
        description: "Re-pin models.lock.json from upstream and upload it as an artifact (instead of only checking)"
        type: boolean
        default: false
  schedule:
    - cron: "17 4 * * 1" # Mondays 04:17 UTC

permissions:
  contents: read

concurrency:
  group: models-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  QT_QPA_PLATFORM: offscreen
  PYTHONUTF8: "1"

jobs:
  models:
    name: Real models (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      VRPHOTO_REAL_MODELS: "1"
      # Shared download folder for the real-model tests (every test otherwise gets its own empty
      # VRPHOTO_HOME).  The tests read these variables and use the folder as their data root, so
      # models land in .models-cache/models/<id>/ and are cached between runs below.
      #   tests/segment, tests/inpaint: VRPHOTO_REAL_MODELS_HOME
      #   tests/depth:                  VRPHOTO_TEST_MODELS_DIR
      VRPHOTO_REAL_MODELS_HOME: ${{ github.workspace }}/.models-cache
      VRPHOTO_TEST_MODELS_DIR: ${{ github.workspace }}/.models-cache
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: Install VR Photo Studio (editable, with dev tools)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Refresh model pins
        if: inputs.refresh_lock
        run: python scripts/pin_models.py --verbose

      - name: Upload refreshed lock file
        if: inputs.refresh_lock
        uses: actions/upload-artifact@v7
        with:
          path: src/vrphoto/models/models.lock.json
          archive: false
          if-no-files-found: error
          retention-days: 30

      - name: Check model pins against upstream
        id: pins
        if: ${{ !inputs.refresh_lock }}
        continue-on-error: true # still run the model tests; the job fails at the end
        run: python scripts/pin_models.py --check --verbose

      - name: Restore model cache
        id: cache
        uses: actions/cache/restore@v6
        with:
          path: .models-cache/models
          key: models-${{ runner.os }}-${{ hashFiles('src/vrphoto/models/models.lock.json') }}
          restore-keys: |
            models-${{ runner.os }}-

      - name: Run real-model tests
        run: |
          mkdir -p .models-cache
          python -m pytest -m models -q -rs --durations=20 tests || {
            rc=$?
            if [ "$rc" -eq 5 ]; then echo "::warning::No tests are marked 'models' yet."; exit 0; fi
            exit "$rc"
          }

      - name: Model cache size
        if: always()
        run: du -sh .models-cache/models/* 2>/dev/null || echo "no model cache"

      - name: Save model cache
        # saved even if a test failed, so the next run does not download everything again
        if: always() && steps.cache.outputs.cache-hit != 'true' && hashFiles('.models-cache/models/**') != ''
        uses: actions/cache/save@v6
        with:
          path: .models-cache/models
          key: ${{ steps.cache.outputs.cache-primary-key }}

      - name: Fail if the model pins are out of date
        if: steps.pins.outcome == 'failure'
        run: |
          echo "::error::models.lock.json does not match upstream. Run this workflow manually with 'refresh_lock' ticked and commit the uploaded models.lock.json."
          exit 1
