[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vrphoto"
dynamic = ["version"]
description = "VR Photo Studio - turn photos into VR content for Meta Quest"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [{ name = "AidanMan217" }]
dependencies = [
    "numpy>=1.26",
    "opencv-python-headless>=5.0,<6",
    "pillow>=10.0",
    "pillow-heif>=0.18",
    "onnxruntime-directml==1.24.4; sys_platform == 'win32'",
    "onnxruntime>=1.20; sys_platform != 'win32'",
    "imageio-ffmpeg==0.6.0",
    "cryptography>=42",
    "qrcode>=7.4",
    "PySide6==6.11.2",
    "uv>=0.8",
    "fast-simplification>=0.1.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-qt>=4.4",
    "pytest-timeout>=2.3",
    "onnx>=1.16",
    "jsonschema>=4.21",
    "pygltflib>=1.16",
    "trimesh>=4.0",
    "ruff>=0.5",
    "pyinstaller>=6.10",
    "pyyaml>=6",
    "fast-simplification>=0.1.7",
]

[project.scripts]
vrphoto-cli = "vrphoto.__main__:cli_entry"

[project.gui-scripts]
vrphoto = "vrphoto.__main__:main"

[tool.setuptools.dynamic]
version = { attr = "vrphoto.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vrphoto = [
    "webxr/viewer/**/*",
    "models/*.json",
    "addons/manifests/*.toml",
    "addons/workers/*.py",
    "third_party/**/*",
    "gui/resources/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
timeout = 300
markers = [
    "gui: needs Qt (offscreen)",
    "slow: slow test",
    "models: needs real downloaded models (CI models job)",
    "windows: Windows-only",
    "network: needs internet",
]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["src/vrphoto/third_party", "src/vrphoto/webxr/viewer"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP"]
ignore = ["E501", "B008", "B905", "UP007", "UP045"]
