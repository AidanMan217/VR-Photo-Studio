# TRELLIS.2 (4B, image -> PBR-textured 3D mesh), Windows build by IgorAherne
# (TRELLIS.2-stableprojectorz): Python 3.11, torch 2.8.0 + CUDA 12.8, prebuilt Windows
# wheels for CuMesh / FlexGEMM / O-Voxel / nvdiffrast / nvdiffrec in the repository (whl/).
# The DINOv3 image encoder is a gated Hugging Face model (token required).  The worker runs
# with the add-on folder as working directory, where the fork looks for MODELS/dinov3 and
# MODELS/RMBG-2.0 (kept outside src/ so a source update does not delete them).
id = "trellis2"
title = "TRELLIS.2 (photo to 3D object, high detail)"
description = """Microsoft's 4-billion-parameter successor of TRELLIS: sharper geometry and PBR \
materials from a single photo. Slower and heavier than TRELLIS; needs a Hugging Face token for the \
DINOv3 image encoder."""
version = "1.0.0"
experimental = true
license = "TRELLIS.2 code and weights: MIT; DINOv3: DINOv3 License (Meta); nvdiffrast / nvdiffrec (NVIDIA): research/non-commercial licenses"
noncommercial = true
region_restricted = []
min_vram_gb = 12
disk_gb = 36
kind = "venv"
python = "3.11"
hf_gated = true
homepage = "https://github.com/microsoft/TRELLIS.2"
tasks = ["image_to_3d"]
worker = "trellis2_worker.py"
platforms = ["win32"]
notes = "Experimental. Low-VRAM mode is on (models are moved to the GPU one at a time); 1024-cascade pipeline by default."

[env]
ATTN_BACKEND = "xformers"
TORCHDYNAMO_DISABLE = "1"
OPENCV_IO_ENABLE_OPENEXR = "1"
PYTORCH_CUDA_ALLOC_CONF = "garbage_collection_threshold:0.65"
TRELLIS2_MODEL = "microsoft/TRELLIS.2-4B"

[[steps]]
type = "venv"

[[steps]]
type = "pip"
title = "Installing PyTorch 2.8.0 (CUDA 12.8) and xFormers"
packages = ["torch==2.8.0", "torchvision==0.23.0", "xformers==0.0.32.post2"]
index_url = "https://download.pytorch.org/whl/cu128"

[[steps]]
type = "github_archive"
title = "Downloading TRELLIS.2 (stable-projectorz fork)"
repo = "IgorAherne/TRELLIS.2-stableprojectorz"
ref = "d5d38f1e033a881e2c00e3137822ef8aa4e193de"
dest = "src/trellis2"
pip_install = false

[[steps]]
type = "pip"
title = "Installing TRELLIS.2 dependencies"
packages = [
    "numpy==2.4.0",
    "pillow==11.3.0",
    "imageio==2.37.0",
    "imageio-ffmpeg==0.6.0",
    "tqdm==4.67.1",
    "easydict==1.13",
    "opencv-python-headless==4.13.0.92",
    "ninja==1.13.0",
    "trimesh==4.10.1",
    "transformers==4.57.3",
    "accelerate==1.12.0",
    "huggingface-hub==0.36.0",
    "safetensors==0.7.0",
    "zstandard==0.25.0",
    "plyfile==1.1.3",
    "kornia==0.8.2",
    "timm==1.0.22",
    # BiRefNet's model code (run via trust_remote_code) imports einops at the top level;
    # transformers refuses to load it when einops is missing.
    "einops==0.8.1",
    "psutil==7.1.3",
    "triton-windows==3.4.0.post21; sys_platform == 'win32'",
    "utils3d @ https://github.com/EasternJournalist/utils3d/archive/9a4eb15e4021b67b12c460c7057d642626897ec8.zip",
]

[[steps]]
type = "pip"
title = "Installing TRELLIS.2 CUDA extensions (prebuilt wheels)"
platforms = ["win32"]
packages = [
    "{src}/trellis2/whl/cumesh-0.0.1-cp311-cp311-win_amd64.whl",
    "{src}/trellis2/whl/flex_gemm-0.0.1-cp311-cp311-win_amd64.whl",
    "{src}/trellis2/whl/nvdiffrast-0.4.0-cp311-cp311-win_amd64.whl",
    "{src}/trellis2/whl/nvdiffrec_render-0.0.0-cp311-cp311-win_amd64.whl",
    "{src}/trellis2/whl/o_voxel-0.0.1-cp311-cp311-win_amd64.whl",
]

[[steps]]
type = "hf_download"
title = "Downloading the DINOv3 image encoder (gated)"
repo = "facebook/dinov3-vitl16-pretrain-lvd1689m"
revision = "main"
local_dir = "MODELS/dinov3"
gated = true
size_gb = 1.3

[[steps]]
# BiRefNet (MIT) in the folder the fork checks for a background remover, so the
# non-commercial / gated briaai/RMBG-2.0 is never downloaded.  Pinned to a commit
# (2026-02-04): its Python code is executed (trust_remote_code), so "main" would let any
# upstream change alter what runs here.
type = "hf_download"
title = "Downloading the BiRefNet background remover"
repo = "ZhengPeng7/BiRefNet"
revision = "e2bf8e4460fc8fa32bba5ea4d94b3233d367b0e4"
local_dir = "MODELS/RMBG-2.0"
gated = false
size_gb = 0.9

[[steps]]
type = "hf_download"
title = "Downloading the TRELLIS.2-4B model"
repo = "microsoft/TRELLIS.2-4B"
revision = "main"
gated = false
size_gb = 16

[[steps]]
type = "hf_download"
title = "Downloading the TRELLIS sparse-structure decoder"
repo = "microsoft/TRELLIS-image-large"
revision = "main"
allow_patterns = ["ckpts/ss_dec_conv3d_16l8_fp16.*"]
gated = false
size_gb = 0.2

[[steps]]
type = "check"
